<!-- ✅ HTML -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Page Title -->
    <!--
      These static tags are the pre-JS / crawler fallback only (Nigeria's
      copy — same as the old single hardcoded version). Once the app loads,
      src/components/SiteMeta.jsx overwrites title/description/keywords/
      canonical/og:*/twitter:* with the CURRENT country's own copy, managed
      per-country in Admin → Content Management → Site Pages → "Site
      Default (index.html)" (slug: site-index) — same pattern as Tawk.to
      below. Run scripts/seedSiteIndexMeta.js to seed Togo/Benin/Italy (and
      re-seed Nigeria) with real, distinct copy instead of relying on this
      fallback indefinitely.
    -->
    <title>Buy Coffee Products Online in Nigeria | I-Coffee</title>

    <!-- ✅ Meta Description (Very Important) -->
    <meta
      name="description"
      content="Discover and shop the best coffee products in Nigeria. From beans to brewers, I-Coffee offers high-quality coffee essentials with fast delivery across Nigeria."
    />

    <!-- ✅ Keywords (Less important now but doesn't hurt) -->
    <meta
      name="keywords"
      content="coffee Nigeria, buy coffee, coffee beans, espresso, coffee accessories, Nigerian coffee store"
    />

    <meta name="author" content="I-Coffee" />

    <link rel="canonical" href="https://www.i-coffee.ng" />

    <meta
      property="og:title"
      content="Buy Coffee Products Online in Nigeria | I-Coffee"
    />
    <meta
      property="og:description"
      content="Shop quality coffee, beans, espresso machines and accessories across Nigeria."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.i-coffee.ng" />
    <meta
      property="og:image"
      content="http://res.cloudinary.com/dwwsz3kss/image/upload/v1752169680/icv-ng/cyzkcev27uypuzjgwna2.jpg"
    />
    <meta property="og:site_name" content="I-Coffee Nigeria" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Buy Coffee Products Online in Nigeria | I-Coffee"
    />
    <meta
      name="twitter:description"
      content="Your one-stop online store for everything coffee in Nigeria."
    />
    <!-- <meta
      name="twitter:image"
      content="https://www.i-coffee.ng/images/twitter-card.jpg"
    /> -->

    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      Tawk.to is now loaded dynamically per country by
      src/components/TawkWidget.jsx (Admin → Settings → Countries → Tawk.to),
      so each market can run its own agent queue instead of one shared widget.
    -->
  </body>
</html>
